<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | MediEvidence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .error-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 48px 36px;
            max-width: 580px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .error-code {
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            line-height: 1;
        }
        .error-title {
            font-size: 1.5rem;
            color: #f1f5f9;
            margin-bottom: 16px;
            font-weight: 700;
        }
        .error-desc {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .error-btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-card">
            <div style="font-size: 3rem; margin-bottom: 16px;">🧬</div>
            <div class="error-code">404</div>
            <h1 class="error-title">Research Page Not Found</h1>
            <p class="error-desc">
                The requested URL or evidence page does not exist in the MediEvidence portal. You can return to the main interactive research dashboard to explore the 30-paper literature corpus.
            </p>
            <div class="error-btn-row">
                <a href="./index.html" class="btn-primary" style="text-decoration: none;">🏠 Return to MediEvidence</a>
                <a href="./index.html#papers" class="btn-outline" style="text-decoration: none;">📚 Browse Research Papers</a>
            </div>
        </div>
    </div>
</body>
</html>
